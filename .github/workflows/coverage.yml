name: Reusable workflow for JASP code coverage

on:
  workflow_call:
    inputs:
      needs_JAGS:
        description: 'Should JAGS be available?'
        required: false
        type: boolean
        default: false
      needs_igraph:
        description: '(Linux only) Should igraph be recompiled?'
        required: false
        type: boolean
        default: false
      continue_on_schedule:
        description: 'Should the workflow also be run on a schedule? By default (false), this only happens when the github.repository_owner is jasp-stats.'
        type: boolean
        default: false
    secrets:
      CODECOV_TOKEN:
        description: 'Token for Codecov upload'
        required: true

jobs:
  scheduled-run-check:
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.check.outputs.status }}

    steps:
      - id: check
        run: echo "status=success" >> $GITHUB_OUTPUT
        if: inputs.continue_on_schedule == true || github.event_name != 'schedule' || github.repository_owner != 'jasp-stats'

  coverage:
    needs: scheduled-run-check
    if: needs.scheduled-run-check.outputs.status == 'success'

    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v6

      - name: Set up the test environment
        uses: jasp-stats/jasp-actions/setup-r-test-env@master
        with:
          r-version: '4.5.2'
          packages: lockfile
          needs-jags: ${{ inputs.needs_JAGS }}

      - name: Install covr if missing from lockfile
        run: |
          if (!require("covr")) renv::install("covr")
        shell: Rscript {0}

      - name: Copy examples to inst (allows coverage testing for examples)
        run: |
          if [ -d examples ] && [ -n "$(ls -A examples 2>/dev/null)" ]; then
            mkdir -p inst/examples
            cp -r examples/* inst/examples/
          else
            echo "No examples directory or no example files found; skipping copy."
          fi
        shell: bash

      - name: Test coverage
        run: |
          cov <- covr::package_coverage(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"), "package")
          )
          print(cov)
          covr::to_cobertura(cov)
        shell: Rscript {0}

      - name: Upload to Codecov
        uses: codecov/codecov-action@v6
        with:
          fail_ci_if_error: ${{ github.event_name != 'pull_request' }}
          files: ./cobertura.xml
          plugins: noop
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Show testthat output
        if: always()
        run: |
          ## --------------------------------------------------------------------
          find '${{ runner.temp }}/package' -name 'testthat.Rout*' -exec cat '{}' \; || true
        shell: bash

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-test-failures
          path: ${{ runner.temp }}/package
