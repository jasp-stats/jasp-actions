name: 'Set up R for JASP tests and coverage'
description: 'Sets up R, system dependencies, lockfile or latest R packages, JAGS, and jaspTools.'
inputs:
  r-version:
    description: 'R version to install.'
    required: false
    default: '4.5.2'
  packages:
    description: 'Package installation mode: lockfile or latest.'
    required: false
    default: 'lockfile'
  needs-jags:
    description: 'Whether JAGS is required (true or false).'
    required: false
    default: 'false'
  r-universe:
    description: 'true: JASP development with the jaspSyntax built on the R-universe (jaspsyntax is ignored). false: jaspSyntax from GitHub, jaspsyntax naming a branch or commit (JASP development) or a release tag (that JASP version). Empty means the inputs below decide (jasp-version, jaspsyntax, jaspsyntax-source).'
    required: false
    default: ''
  jasp-version:
    description: 'JASP version to run the analyses with: development, or the tag of a JASP release (e.g. v0.99.1). Empty means development.'
    required: false
    default: 'development'
  jaspsyntax:
    description: 'The jaspSyntax of the development version: r-universe (built from jaspSyntax master), or a jaspSyntax branch, tag or commit on GitHub, built here (its configure picks the SyntaxInterface library). Empty means jaspsyntax-source.'
    required: false
    default: ''
  jaspsyntax-source:
    description: 'Older form of jaspsyntax, used when that is empty: r-universe or github (jaspSyntax master).'
    required: false
    default: 'r-universe'

runs:
  using: composite
  steps:
    - name: Configure the test environment
      env:
        PACKAGE_SETUP: ${{ inputs.packages }}
        JASP_VERSION: ${{ inputs.jasp-version || 'development' }}
        JASPSYNTAX: ${{ inputs.jaspsyntax }}
        JASPSYNTAX_SOURCE: ${{ inputs.jaspsyntax-source || 'r-universe' }}
        R_UNIVERSE: ${{ inputs.r-universe }}
      run: |
        case "$PACKAGE_SETUP" in
          lockfile|latest) ;;
          *) echo "::error::packages must be lockfile or latest"; exit 1 ;;
        esac
        case "$R_UNIVERSE" in
          true)
            JASP_VERSION=development
            JASPSYNTAX=r-universe ;;
          false)
            REF="${JASPSYNTAX:-master}"
            [ "$REF" = "development" ] && REF=master   # jaspSyntax has no development branch: master goes with JASP development
            if [ "$REF" = "r-universe" ] || ! [[ "$REF" =~ ^[A-Za-z0-9._/-]+$ ]]; then
              echo "::error::Without r-universe, jaspsyntax must be a jaspSyntax branch, commit or release tag, not '$REF'"; exit 1
            fi
            # A ref with a jaspSyntax release (every full build uploads SHA256SUMS) is a JASP version:
            # jaspTools::setupJaspTools() installs it. jaspTools itself needs some jaspSyntax to install first.
            if curl -fsIL -o /dev/null "https://github.com/jasp-stats/jaspSyntax/releases/download/$REF/SHA256SUMS"; then
              echo "jaspSyntax $REF is a release: running with JASP $REF"
              JASP_VERSION="$REF"
              JASPSYNTAX=r-universe
            else
              JASP_VERSION=development
              JASPSYNTAX="$REF"
            fi ;;
          "") ;;
          *) echo "::error::r-universe must be true, false or empty"; exit 1 ;;
        esac
        if [ -z "$JASPSYNTAX" ]; then
          case "$JASPSYNTAX_SOURCE" in
            r-universe) JASPSYNTAX=r-universe ;;
            # A release tag ignores it, as before jaspsyntax existed
            github)     if [ "$JASP_VERSION" = "development" ]; then JASPSYNTAX=master; else JASPSYNTAX=r-universe; fi ;;
            *) echo "::error::jaspsyntax-source must be r-universe or github"; exit 1 ;;
          esac
        fi
        if ! [[ "$JASP_VERSION" =~ ^[A-Za-z0-9._-]+$ ]]; then
          echo "::error::jasp-version must be development or the tag of a JASP release, e.g. v0.99.1"; exit 1
        fi
        # jaspTools::setupJaspTools() reads JASPTOOLS_JASP_VERSION
        echo "JASPTOOLS_JASP_VERSION=$JASP_VERSION" >> "$GITHUB_ENV"
        if ! [[ "$JASPSYNTAX" =~ ^[A-Za-z0-9._/-]+$ ]]; then
          echo "::error::jaspsyntax must be r-universe or a branch, tag or commit of jaspSyntax"; exit 1
        fi
        if [ "$JASPSYNTAX" != "r-universe" ] && [ "$JASP_VERSION" != "development" ]; then
          echo "::error::jaspsyntax $JASPSYNTAX only applies to jasp-version development: JASP $JASP_VERSION uses the jaspSyntax of that release"; exit 1
        fi
        # JASPSYNTAX_REF is the GitHub ref; empty means the R-universe
        if [ "$JASPSYNTAX" = "r-universe" ]; then JASPSYNTAX_REF=""; else JASPSYNTAX_REF="$JASPSYNTAX"; fi
        echo "JASPSYNTAX_REF=$JASPSYNTAX_REF" >> "$GITHUB_ENV"
        if [ "$JASP_VERSION" = "development" ]; then
          echo "JASP development, jaspSyntax from: ${JASPSYNTAX_REF:+GitHub }$JASPSYNTAX"
        else
          echo "JASP $JASP_VERSION: jaspTools::setupJaspTools() installs the jaspSyntax of that release from GitHub"
        fi
        # GITHUB_ENV also makes these settings available to the caller's
        # subsequent test or coverage steps.
        cat >> "$GITHUB_ENV" <<'EOF'
        R_REMOTES_NO_ERRORS_FROM_WARNINGS=true
        R_REMOTES_UPGRADE=never
        VDIFFR_RUN_TESTS=true
        RENV_CONFIG_INSTALL_JOBS=1
        RENV_CONFIG_INSTALL_STAGED=false
        RENV_CONFIG_REPOS_OVERRIDE=https://packagemanager.posit.co/cran/latest
        RENV_CONFIG_PAK_ENABLED=false
        RENV_CONFIG_INSTALL_VERBOSE=true
        PKG_BUILD_CORES=1
        PAK_CORES=1
        _R_CHECK_LENGTH_1_CONDITION_=TRUE
        _R_CHECK_MATRIX_DATA_=TRUE
        EOF
      shell: bash

    - uses: r-lib/actions/setup-r@v2
      with:
        r-version: ${{ inputs.r-version }}
        Ncpus: 1
        # jaspSyntax, which jaspTools imports, is published here. pak (pkg_sysreqs and
        # setup-r-dependencies) ignores the Additional_repositories field of jaspTools.
        extra-repositories: https://jasp-stats.r-universe.dev

    # A module whose .Rprofile activates renv loses that extra repository: renv sets
    # options(repos) to the repositories of renv.lock, so pak then cannot find jaspSyntax.
    # R reads R_PROFILE_USER instead of ./.Rprofile, so this profile runs the module's
    # .Rprofile (or ~/.Rprofile, as R would) and then adds the R-universe back.
    # renv's activate.R sources R_PROFILE_USER itself when its autoloader is disabled (as
    # during R CMD INSTALL), so this profile runs again from inside the .Rprofile it sources:
    # the guard keeps that from recursing until "evaluation nested too deeply".
    - name: Keep the jasp-stats R-universe when renv is activated
      run: |
        profile <- file.path(Sys.getenv("RUNNER_TEMP"), "jasp-Rprofile.R")
        writeLines(c(
          "# Written by jasp-actions/setup-r-test-env",
          "if (!isTRUE(getOption('jasp.rprofile.sourcing'))) local({",
          "  options(jasp.rprofile.sourcing = TRUE)",
          "  on.exit(options(jasp.rprofile.sourcing = NULL))",
          "  profile <- if (file.exists('.Rprofile')) '.Rprofile' else path.expand('~/.Rprofile')",
          "  if (file.exists(profile)) source(profile)",
          "})",
          "local({",
          "  universe <- 'https://jasp-stats.r-universe.dev'",
          "  repos <- getOption('repos')",
          "  if (!universe %in% sub('/+$', '', repos))",
          "    options(repos = c(repos, jasp = universe))",
          "})"
        ), profile)
        cat("R_PROFILE_USER=", normalizePath(profile, winslash = "/"), "\n", sep = "",
            file = Sys.getenv("GITHUB_ENV"), append = TRUE)
      shell: Rscript --vanilla {0}

    # jaspSyntax needs libOpenGL.so.0 and libEGL.so.1. pak does not install them: the R-universe index
    # lists its SystemRequirements as only c++ (when it came from GitHub, pak read them from its DESCRIPTION).
    - name: Install OpenGL on Linux
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y libopengl0 libegl1
      shell: bash

    - name: Install system dependencies on macOS
      if: runner.os == 'macOS'
      uses: r-hub/actions/setup-r-sysreqs@v1
      with:
        type: full

    - name: Install libtool on macOS
      if: runner.os == 'macOS'
      run: |
        # The sysreqs bundle above puts automake on the PATH, so httpuv's
        # bundled libuv reruns its autogen.sh when built from source. That
        # script calls glibtoolize, which only Homebrew's libtool provides;
        # without it the build ends with "aclocal-1.16: command not found".
        brew install libtool
      shell: bash

    - name: Install system dependencies on macOS specific to R devel
      if: runner.os == 'macOS' && inputs.r-version == 'devel'
      run: |
        # ragg                                          requires harfbuzz fribidi
        # The dependencies of the two R packages below are required for compiling from source on Ubuntu, but macOS seems fine without them
        # credentials   (dependency of usethis)         requires libgit2
        # curl          (dependency of usethis)         requires openssl

        brew install harfbuzz fribidi libgit2 openssl curl libpng
      shell: bash

    - name: Download JAGS and set JAGS_HOME on Windows
      if: runner.os == 'Windows' && inputs.needs-jags == 'true'
      run: |
        beforeR420 <- getRversion() < "4.2.0"

        jagsUrl <- if (beforeR420) {
          'https://static.jasp-stats.org/development/JAGS-4.3.0-Windows.zip'
        } else {
          'https://static.jasp-stats.org/development/JAGS-4.3.1-Windows.zip'
        }

        destfile <- 'JAGS-Windows.zip'
        download.file(jagsUrl, destfile = destfile)
        unzip(destfile, exdir = 'JAGS')

        con <- file(description = Sys.getenv("GITHUB_ENV"), open = "a")
        on.exit(close(con))

        jagsHome <- jagsRoot <- normalizePath("JAGS", winslash = "/")
        cat("JAGS_HOME=", jagsHome, "\n", sep = "", file = con)
        cat("JAGS_ROOT=", jagsRoot, "\n", sep = "", file = con)

      working-directory: ..
      shell: Rscript {0}

    - name: Install JAGS on macOS
      if: runner.os == 'macOS' && inputs.needs-jags == 'true'
      env:
        JAGS_VERSION: '4.3.2'
        JAGS_SHA256: '14d171621a582d29a7e6ce11eccf853170367c17d41554e07b88abed76a2fb7e'
      run: |
        # Use the official (signed, universal) JAGS installer rather than
        # Homebrew: Homebrew's jags is JAGS 5, which rjags refuses ("rjags
        # requires JAGS version 4.x.y"), and it pulls in Homebrew's libomp,
        # which makes data.table build against a libomp that R's own, older
        # libomp.dylib then shadows at load time. The installer is
        # self-contained and puts JAGS in /usr/local, where rjags looks for it.
        pkg="$RUNNER_TEMP/JAGS-${JAGS_VERSION}.pkg"
        curl -fsSL --retry 5 --retry-all-errors -o "$pkg" \
          "https://sourceforge.net/projects/mcmc-jags/files/JAGS/4.x/Mac%20OS%20X/JAGS-${JAGS_VERSION}.pkg/download"
        echo "${JAGS_SHA256}  $pkg" | shasum -a 256 -c -
        sudo installer -pkg "$pkg" -target /
        ls -l /usr/local/bin/jags /usr/local/lib/libjags*.dylib /usr/local/lib/libjrmath*.dylib
        grep '^Version' /usr/local/lib/pkgconfig/jags.pc
      shell: bash

      # copied from https://github.com/r-lib/actions/blob/6b49fefb2846ed3e5e6e58366e7f7dfe01377f02/setup-r-dependencies/action.yaml#L67
    - name: Set site library path
      if: runner.os == 'Linux' && inputs.packages == 'lockfile'
      run: |
        # Set site library path
        cat("::group::Set site library path\n")
        libpak <- Sys.getenv("R_LIB_FOR_PAK")
        if (libpak != "") {
          message("R_LIB_FOR_PAK is already set to ", libpak)
        }
        if (Sys.getenv("RENV_PROJECT") != "") {
          message("renv project detected, no need to set R_LIBS_SITE")
          if (libpak == "") {
            cat(sprintf("R_LIB_FOR_PAK=%s\n", .libPaths()[1]), file = Sys.getenv("GITHUB_ENV"), append = TRUE)
            message("Setting R_LIB_FOR_PAK to ", .libPaths()[1])
          }
          q("no")
        }
        lib <- Sys.getenv("R_LIBS_SITE")
        if (lib == "") {
          lib <- file.path(dirname(.Library), "site-library")
          cat(sprintf("R_LIBS_SITE=%s\n", lib), file = Sys.getenv("GITHUB_ENV"), append = TRUE)
          message("Setting R_LIBS_SITE to ", lib)
          if (libpak == "") {
            cat(sprintf("R_LIB_FOR_PAK=%s\n", lib), file = Sys.getenv("GITHUB_ENV"), append = TRUE)
            message("Setting R_LIB_FOR_PAK to ", lib)
          }
        } else {
          message("R_LIBS_SITE is already set to ", lib)
          if (libpak == "") {
            plib <- strsplit(lib, .Platform$path.sep)[[1]][[1]]
            cat(sprintf("R_LIB_FOR_PAK=%s\n", plib), file = Sys.getenv("GITHUB_ENV"), append = TRUE)
            message("Setting R_LIB_FOR_PAK to ", plib)
          }
        }
        if (nchar("${{ env.R_LIBS_USER && 'ok' || '' }}") == 0) {
          message("R_LIBS_USER GH env var is unset, setting now: ", Sys.getenv("R_LIBS_USER"))
          cat(sprintf("R_LIBS_USER=%s\n", Sys.getenv("R_LIBS_USER")), file = Sys.getenv("GITHUB_ENV"), append = TRUE)
        } else {
          message("R_LIBS_USER GH env var is already set: ", Sys.getenv("R_LIBS_USER"))
        }
        dir.create(Sys.getenv("R_LIBS_SITE"), recursive = TRUE, showWarnings = FALSE)
        dir.create(Sys.getenv("R_LIBS_USER"), recursive = TRUE, showWarnings = FALSE)
        cat("::endgroup::\n")
      shell: Rscript {0}

    - name: Install pak (Unix)
      if: runner.os == 'Linux' && inputs.packages == 'lockfile'
      run: |
        # Install pak
        echo "::group::Install pak"
        # Only escalate when the runner cannot write the target library. With renv,
        # R_LIB_FOR_PAK is the project library in the runner's home, and renv's
        # install.packages() shim installs into the project library it derives
        # from HOME. sudo on ubuntu-26.04 (sudo-rs) ignores -E and resets HOME, so
        # under sudo pak landed in /root's renv library and later steps could not
        # find it.
        SUDO=""
        if ! mkdir -p "$R_LIB_FOR_PAK" 2>/dev/null || [ ! -w "$R_LIB_FOR_PAK" ]; then
          if which sudo >/dev/null; then SUDO="sudo -E --preserve-env=PATH,R_LIB_FOR_PAK env"; fi
        fi
        $SUDO R -q -e 'dir.create(Sys.getenv("R_LIB_FOR_PAK"), recursive = TRUE, showWarnings = FALSE)'
        $SUDO R -q -e 'if (FALSE) { install.packages("pak", lib = Sys.getenv("R_LIB_FOR_PAK")) } else { install.packages("pak", lib = Sys.getenv("R_LIB_FOR_PAK"), repos = sprintf("https://r-lib.github.io/p/pak/%s/%s/%s/%s", "stable", .Platform$pkgType, R.Version()$os, R.Version()$arch)) }'
        echo "::endgroup::"
      shell: bash

    # adjusted from https://github.com/r-lib/actions/blob/6b49fefb2846ed3e5e6e58366e7f7dfe01377f02/setup-renv/action.yaml#L25-L28
    - name: Set RENV_PATHS_ROOT
      if: inputs.packages == 'lockfile'
      shell: bash
      run: |
        echo "RENV_PATHS_ROOT=${{ runner.temp }}/renv" >> $GITHUB_ENV
        echo "R_PKG_CACHE_DIR=${{ runner.temp }}/pkgcache" >> $GITHUB_ENV

    - name: Install renv
      run: |
        install.packages("renv")
        # renv 1.3.1. The development version pinned before (44b3f47, 1.2.3.9000)
        # failed on GitHub packages that live in a sub-directory of their
        # repository (SamCH93/bfpwr/package): "target file ... already exists".
        renv::install("rstudio/renv@b9bddd3b176f1f0dfb5ecdeef8625f2cd4fca23c")
      shell: Rscript {0}

    - name: Install system dependencies on linux
      if: runner.os == 'Linux' && inputs.packages == 'lockfile'
      run: |
        lib <- Sys.getenv("R_LIB_FOR_PAK")
        lf <- renv::lockfile_read("renv.lock")
        # TODO: this should actually use the version from the lockfile as well...
        # not sure how to do that efficiently though, we could redirect everything to
        # cran/pkg@version? that would make a ton of github api calls though
        pkgs <- vapply(lf$Packages,
             FUN = function(x) {
               if (x$Source == "GitHub") {
                 # keep the sub-directory of the package, e.g. SamCH93/bfpwr/package
                 paste(c(x$RemoteUsername, x$RemoteRepo, x$RemoteSubdir), collapse = "/")
               } else {
                 x$Package
               }
             },
             FUN.VALUE = character(1L)
        )
        # add jaspTools manually if missing (it requires libarchive)
        pkgs <- union(pkgs, "jasp-stats/jaspTools")
        .libPaths(lib) # make sure pak is found
        res <- pak::pkg_sysreqs(pkgs, sysreqs_platform = "ubuntu")
        cmd <- paste("sudo", res$install_scripts)
        cat(sprintf("Running cmd:\n%s\n", cmd))
        system(paste("sudo", res$install_scripts))
      shell: Rscript {0}

    - uses: r-lib/actions/setup-renv@v2
      if: inputs.packages == 'lockfile'
      with:
        cache-version: 6

    - uses: r-lib/actions/setup-r-dependencies@v2
      if: inputs.packages == 'latest'
      with:
        extra-packages: |
          any::rcmdcheck
          github::jasp-stats/jaspTools
        needs: check
        cache-version: 3

    # After setup-r-dependencies, which would otherwise replace it (and may restore one from its cache).
    # A release tag is installed by jaspTools::setupJaspTools() below; jaspTools only needs some jaspSyntax to install.
    - name: Install jaspSyntax
      run: |
        universe <- "https://jasp-stats.r-universe.dev"
        cran     <- Sys.getenv("RENV_CONFIG_REPOS_OVERRIDE")
        fromGithub <- nzchar(Sys.getenv("JASPSYNTAX_REF")) && Sys.getenv("JASPTOOLS_JASP_VERSION") == "development"
        if (fromGithub) {
          repo <- paste0("jasp-stats/jaspSyntax@", Sys.getenv("JASPSYNTAX_REF"))
          if ("${{ inputs.packages }}" == "lockfile") {
            renv::install(repo)
          } else {
            remotes::install_github(repo, upgrade = "never", force = TRUE)
          }
        } else {
          utils::install.packages("jaspSyntax", repos = c(jasp = universe, CRAN = cran))
        }
        desc <- utils::packageDescription("jaspSyntax")
        # An R-universe build records its commit too, so look at Repository first
        from <- if (!is.null(desc$Repository)) desc$Repository else paste0("GitHub ", desc$RemoteRef)
        cat("jaspSyntax", desc$Version, "from", from, "commit", desc$RemoteSha, "\n")
      shell: Rscript {0}

    - name: Install jaspTools if missing from lockfile
      if: inputs.packages == 'lockfile'
      run: |
        # renv ignores the Additional_repositories field of jaspTools; jaspSyntax is installed in the step above.
        if (!require("jaspTools"))
          renv::install("jasp-stats/jaspTools")
      shell: Rscript {0}

    - name: Install JAGS on Linux
      if: runner.os == 'Linux' && inputs.needs-jags == 'true'
      run: sudo apt install jags
      shell: bash

    - name: Setup jaspTools
      run: |
        jaspTools::setupJaspTools()
      shell: Rscript {0}

